<mat-toolbar class="toolbar" role="banner">
  @if (isHandset()) {
    <button mat-icon-button type="button" (click)="sidenav.toggle()"
            [attr.aria-label]="'toolbar.toggle-navigation' | translate">
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
  }
  <img class="logo" [src]="logoPath" [alt]="'toolbar.logo-alt' | translate">
  <span class="title">{{ 'toolbar.title' | translate }}</span>
  <span class="spacer"></span>
  <app-language-switcher/>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #sidenav class="sidenav" [mode]="isHandset() ? 'over' : 'side'" [opened]="!isHandset()">
    <nav [attr.aria-label]="'navigation.label' | translate">
      <mat-nav-list>
        @for (option of options; track option.link) {
          <a mat-list-item [routerLink]="option.link" routerLinkActive="active-link" ariaCurrentWhenActive="page"
             (click)="isHandset() && sidenav.close()">
            <mat-icon matListItemIcon aria-hidden="true">{{ option.icon }}</mat-icon>
            <span matListItemTitle>{{ option.label | translate }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet/>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
