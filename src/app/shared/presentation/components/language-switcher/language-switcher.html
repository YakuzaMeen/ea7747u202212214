<mat-button-toggle-group
  [value]="currentLanguage()"
  (change)="useLanguage($event.value)"
  [attr.aria-label]="'toolbar.language-selector' | translate"
  hideSingleSelectionIndicator>
  @for (language of languages; track language) {
    <mat-button-toggle [value]="language" [attr.aria-label]="'languages.' + language | translate">
      {{ language | uppercase }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
